# Dev overrides — auto-loaded de `docker compose up`.
# NU comita modificări care expun secrete sau bind la 0.0.0.0 în prod.
#
# Pentru prod: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  postgres:
    # NU expunem port pe host — Odoo accesează postgres prin network paff-erp-net.
    # Pentru psql debugging din host: `docker exec -it paff-erp-postgres psql -U odoo_user -d paff_prod`
    # Decizie: range 830x e ocupat de Ecommerce monorepo (paff-postgres, paff-redis, paff-meilisearch,
    # paff-minio, etc). Evităm conflict permanent printr-un access pattern uniform via docker exec.

  odoo:
    ports:
      # HTTP main — accesibil din host pentru browser localhost
      - "127.0.0.1:8310:8069"
      # Longpolling (websocket pentru chat, notificări Odoo)
      - "127.0.0.1:8312:8072"
    environment:
      # Dev mode: threaded (workers=0), reload pe modificare addon
      ODOO_WORKERS: "0"
      # Hot-reload pe addon files via inotify
      DEV_MODE: "reload,qweb,werkzeug,xml"
    volumes:
      # Hot-reload addon-uri custom (read-write în dev, ro în prod)
      - ./src/addons:/mnt/extra-addons
      # Logs accesibile din host pentru tail/grep
      - ./logs:/var/log/odoo
