; PAFF Odoo configuration
; Documentat în docs/runbooks/upgrade.md
; Variabilele cu ${...} sunt populate din .env la container start

[options]
; ─── Database ──────────────────────────────────────────────────
db_host = ${ODOO_DB_HOST}
db_port = ${ODOO_DB_PORT}
db_user = ${ODOO_DB_USER}
db_password = ${ODOO_DB_PASSWORD}
db_name = ${ODOO_DB_NAME}
db_maxconn = 64
list_db = False

; ─── Master password — controlează /web/database/manager ────────
admin_passwd = ${ODOO_MASTER_PASSWORD}

; ─── Addons path: PAFF custom + OCA l10n_ro + Odoo core ──────────
; Layer 3 (custom) → OCA vendor (l10n-romania submodule) → Layer 1 (Odoo core)
addons_path = /mnt/extra-addons,/mnt/extra-addons-vendor/l10n-romania,/usr/lib/python3/dist-packages/odoo/addons

; ─── Data dir & filestore (Layer 1 storage) ────────────────────
; Filestore = attachment-uri PDF/imagini, NU sunt în PG
; Backup separat obligatoriu (vezi scripts/backup-db.sh)
data_dir = /var/lib/odoo

; ─── Workers (production) ──────────────────────────────────────
workers = ${ODOO_WORKERS}
max_cron_threads = 2
limit_memory_soft = ${ODOO_LIMIT_MEMORY_SOFT}
limit_memory_hard = ${ODOO_LIMIT_MEMORY_HARD}
limit_time_cpu = ${ODOO_LIMIT_TIME_CPU}
limit_time_real = ${ODOO_LIMIT_TIME_REAL}

; ─── HTTP ──────────────────────────────────────────────────────
http_port = 8069
gevent_port = 8072
proxy_mode = True

; ─── Logging ───────────────────────────────────────────────────
log_level = info
logfile = False
; log_handler = :INFO,werkzeug:WARNING,odoo.sql_db:WARNING

; ─── Security ──────────────────────────────────────────────────
; Disable demo data în production
without_demo = all

; CSP & cookie hardening (Odoo 19+)
; Security headers se setează în nginx VPS (vezi docs/deploy/nginx-erp-paff-ro.conf.example)
